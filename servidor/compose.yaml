# Juiz do WishLens numa máquina da turma, só com software open source (Docker, Caddy, FastAPI, CLIP).
#   docker compose up -d                    -> juiz em http://<ip-da-máquina>:7860
#   docker compose --profile https up -d    -> também em https://<DOMINIO> (precisa de domínio e das portas 80/443)
services:
  juiz:
    build: ./space
    restart: unless-stopped
    environment:  # vêm do servidor/.env (o compose lê sozinho); sem eles o jogo fica em memória
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      # 2º juiz: IA de visão open source (Ollama, MIT + Qwen2.5-VL 7B, Apache 2.0). Sem VISAO_URL, só o CLIP julga.
      # Na placa de vídeo: Ollama do Windows + ponte, VISAO_URL=http://<ip do WSL>:11434/v1 no servidor/.env.
      # No processador: VISAO_URL=http://ollama:11434/v1 e docker compose --profile ia-cpu up -d
      VISAO_URL: ${VISAO_URL:-}
      VISAO_MODELO: ${VISAO_MODELO:-qwen2.5vl:7b}
    ports: ["7860:7860"]
    # avisos do suporte e dados do chat (conversas e fotos): sobrevivem a reinícios
    volumes: [avisos:/home/user/avisos, dados:/home/user/dados, treino:/home/user/treino]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/saude')"]
      interval: 30s
      start_period: 60s

  # IA de visão no processador (perfil ia-cpu). Sem placa de vídeo leva ~30-60 s por foto; o modelo (~6 GB) fica no volume ollama.
  # Baixar o modelo uma vez: docker compose exec ollama ollama pull qwen2.5vl:7b
  ollama:
    image: ollama/ollama:0.12.6
    profiles: [ia-cpu]
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 24h  # deixa o modelo na memória: carregar de novo custa ~20 s
    volumes: [ollama:/root/.ollama]

  https:
    image: caddy:2
    profiles: [https]
    restart: unless-stopped
    command: caddy reverse-proxy --from ${DOMINIO:-localhost} --to juiz:7860
    ports: ["80:80", "443:443"]
    volumes: [caddy:/data]  # o certificado do Let's Encrypt fica guardado entre reinícios

volumes:
  caddy: {}
  avisos: {}
  dados: {}
  treino: {}   # fotos do modo "Treinar o juiz" (só neste PC)
  ollama: {}
